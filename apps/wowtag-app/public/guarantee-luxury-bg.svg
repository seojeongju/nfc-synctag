<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1700" viewBox="0 0 1200 1700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1410"/>
      <stop offset="35%" style="stop-color:#2d2318"/>
      <stop offset="55%" style="stop-color:#3a2e22"/>
      <stop offset="100%" style="stop-color:#15100c"/>
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b6914;stop-opacity:0"/>
      <stop offset="40%" style="stop-color:#d4af37;stop-opacity:0.45"/>
      <stop offset="60%" style="stop-color:#f5e6c8;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#8b6914;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="40%" r="75%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#000;stop-opacity:0.5"/>
    </radialGradient>
    <pattern id="fineGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#c9a227" stroke-opacity="0.06" stroke-width="0.5"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#fineGrid)"/>
  <rect width="100%" height="45%" fill="url(#goldShine)" opacity="0.9"/>
  <ellipse cx="600" cy="200" rx="480" ry="160" fill="#d4af37" opacity="0.08" filter="url(#softGlow)"/>
  <ellipse cx="200" cy="1400" rx="350" ry="200" fill="#b8860b" opacity="0.06"/>
  <ellipse cx="1000" cy="1200" rx="400" ry="280" fill="#f5e6c8" opacity="0.04"/>
  <path d="M80 80 L1120 80 L1120 1620 L80 1620 Z" fill="none" stroke="#c9a227" stroke-opacity="0.22" stroke-width="1.5"/>
  <path d="M100 100 L1100 100 L1100 1600 L100 1600 Z" fill="none" stroke="#d4af37" stroke-opacity="0.12" stroke-width="0.75"/>
  <rect width="100%" height="100%" fill="url(#vignette)"/>
</svg>
